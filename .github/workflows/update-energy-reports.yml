name: Update energy reports

on:
  push:
    branches: [master]
    paths:
      - 'VO_HfO2_plus1_0/*/VO_HfO2_plus1_0.json'
      - 'VO_HfO2_0_minus1/*/VO_HfO2_0_minus1.json'
      - 'scripts/summarize_energies.py'
      - '.github/workflows/update-energy-reports.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: energy-reports-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install plotting dependency
        run: python -m pip install matplotlib==3.11.2
      - name: Regenerate tables and plots
        run: python scripts/summarize_energies.py
      - name: Commit updated reports
        run: |
          git add -- VO_HfO2_plus1_0/README.md VO_HfO2_plus1_0/figs/energy_statistics.png
          git add -- VO_HfO2_0_minus1/README.md VO_HfO2_0_minus1/figs/energy_statistics.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update energy statistics reports'
          git push origin HEAD:refs/heads/master
